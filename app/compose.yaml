services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 8000:8000
    volumes:
      - .:/app/app
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: python -m arq app.api.background_tasks.arq_worker.WorkerSettings
    volumes:
      - .:/app/app
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
  redis:
    # AsyncRedisSaver requires RedisJSON and RediSearch, included in Redis Stack.
    image: redis/redis-stack-server:latest
    volumes:
      - ./redis.conf:/redis-stack.conf:ro
      - redis-data:/data
volumes:
  redis-data:
